<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JF Reformas - Cotizador de PVC</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #e0e0e0;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .tarjeta {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
            width: 100%;
            max-width: 400px;
            border-top: 6px solid #000000;
        }
        .logo-container {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }
        .logo-container img {
            width: 130px;
            height: 130px;
            object-fit: cover;
            border-radius: 50%;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            background-color: #000;
        }
        label {
            font-weight: bold;
            color: #000000;
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-size: 14px;
        }
        .medidas-flex {
            display: flex;
            gap: 10px;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 2px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 15px;
            transition: border-color 0.3s;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #000000;
        }
        .resumen-m2 {
            text-align: right;
            font-size: 14px;
            color: #666;
            margin-top: 5px;
            font-weight: bold;
        }
        
        .botones-ambiente {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        .botones-ambiente button {
            flex: 1;
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
            border: 2px solid #ccc;
            border-radius: 8px;
            cursor: pointer;
            background-color: white;
            color: #333;
            transition: all 0.3s ease;
        }
        .botones-ambiente button.btn-activo {
            border-color: #000000;
            background-color: #000000;
            color: white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        #canvas-container {
            width: 100%;
            height: 200px;
            background-color: #f0f0f0;
            border-radius: 10px;
            margin-top: 20px;
            overflow: hidden;
            border: 1px solid #ddd;
        }
        .precio-final {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            color: #000000;
            margin: 10px 0 20px 0;
        }
        .boton-whatsapp {
            background-color: #25D366;
            color: white;
            border: none;
            width: 100%;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(37, 211, 102, 0.3);
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div class="tarjeta">
        <div class="logo-container">
            <img src="image_3.png.jpg" alt="Logo JF Reformas">
        </div>

        <label>Pared 1 (Ancho x Alto en metros)</label>
        <div class="medidas-flex">
            <input type="number" id="ancho1" placeholder="Ancho" value="3" min="0" step="0.1" oninput="actualizarCotizacion()">
            <input type="number" id="alto1" placeholder="Alto" value="2.5" min="0" step="0.1" oninput="actualizarCotizacion()">
        </div>

        <label>Pared 2 (Ancho x Alto en metros)</label>
        <div class="medidas-flex">
            <input type="number" id="ancho2" placeholder="Ancho" value="3" min="0" step="0.1" oninput="actualizarCotizacion()">
            <input type="number" id="alto2" placeholder="Alto" value="2.5" min="0" step="0.1" oninput="actualizarCotizacion()">
        </div>

        <label>Pared 3 (Ancho x Alto en metros)</label>
        <div class="medidas-flex">
            <input type="number" id="ancho3" placeholder="Ancho" value="0" min="0" step="0.1" oninput="actualizarCotizacion()">
            <input type="number" id="alto3" placeholder="Alto" value="0" min="0" step="0.1" oninput="actualizarCotizacion()">
        </div>

        <label>Pared 4 (Ancho x Alto en metros)</label>
        <div class="medidas-flex">
            <input type="number" id="ancho4" placeholder="Ancho" value="0" min="0" step="0.1" oninput="actualizarCotizacion()">
            <input type="number" id="alto4" placeholder="Alto" value="0" min="0" step="0.1" oninput="actualizarCotizacion()">
        </div>

        <div class="resumen-m2" id="texto-m2">Total: 0 m² (0 placas)</div>

        <label>Tipo de Ambiente (Incluye costo de instalación)</label>
        <div class="botones-ambiente">
            <button id="btn-otro" class="btn-activo" onclick="seleccionarAmbiente(60000, 'Otro', this)">Otro ($60k/placa)</button>
            <button id="btn-bano" onclick="seleccionarAmbiente(65000, 'Baño', this)">Baño ($65k/placa)</button>
        </div>

        <label>Color de Placa (Sin cargo extra)</label>
        <select id="modelo" onchange="actualizarCotizacion()">
            <option value="Blanco Clásico">Blanco Clásico</option>
            <option value="Gris">Gris</option>
            <option value="Símil Madera">Símil Madera</option>
        </select>

        <div id="canvas-container"></div>

        <div class="precio-final" id="precio-texto">$ 0</div>

        <button class="boton-whatsapp" onclick="enviarWhatsApp()">Pedir por WhatsApp</button>
    </div>

    <script>
        let escena, camara, renderizador, placa3D;
        let totalMetrosCuadrados = 0;
        let cantidadPlacas = 0;
        
        let precioPorPlaca = 60000;
        let tipoAmbienteSeleccionado = "Otro";
        
        // --- ACÁ ESTÁ EL CAMBIO SOLICITADO ---
        const METROS_POR_PLACA = 2.93; 

        function iniciar3D() {
            const contenedor = document.getElementById('canvas-container');
            escena = new THREE.Scene();
            camara = new THREE.PerspectiveCamera(50, contenedor.clientWidth / contenedor.clientHeight, 0.1, 1000);
            renderizador = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderizador.setSize(contenedor.clientWidth, contenedor.clientHeight);
            contenedor.appendChild(renderizador.domElement);

            const luzAmbiental = new THREE.AmbientLight(0xffffff, 0.7);
            escena.add(luzAmbiental);
            const luzDireccional = new THREE.DirectionalLight(0xffffff, 0.8);
            luzDireccional.position.set(5, 10, 7);
            escena.add(luzDireccional);

            const geometria = new THREE.BoxGeometry(1, 0.1, 1);
            const material = new THREE.MeshStandardMaterial({ 
                color: 0xf5f5f5,
                roughness: 0.3,
                metalness: 0.1
            });
            placa3D = new THREE.Mesh(geometria, material);
            escena.add(placa3D);

            function animar() {
                requestAnimationFrame(animar);
                placa3D.rotation.y += 0.005;
                renderizador.render(escena, camara);
            }
            animar();
            actualizarCotizacion();
        }

        function seleccionarAmbiente(precio, tipo, botonElement) {
            precioPorPlaca = precio;
            tipoAmbienteSeleccionado = tipo;

            document.getElementById('btn-otro').classList.remove('btn-activo');
            document.getElementById('btn-bano').classList.remove('btn-activo');

            botonElement.classList.add('btn-activo');

            actualizarCotizacion();
        }

        function calcularArea(idAncho, idAlto) {
            const ancho = parseFloat(document.getElementById(idAncho).value) || 0;
            const alto = parseFloat(document.getElementById(idAlto).value) || 0;
            return ancho * alto;
        }

        function actualizarCotizacion() {
            const area1 = calcularArea('ancho1', 'alto1');
            const area2 = calcularArea('ancho2', 'alto2');
            const area3 = calcularArea('ancho3', 'alto3');
            const area4 = calcularArea('ancho4', 'alto4');
            
            totalMetrosCuadrados = area1 + area2 + area3 + area4;
            
            // Calcula las placas en base al nuevo rendimiento de 2.93 m2
            cantidadPlacas = Math.ceil(totalMetrosCuadrados / METROS_POR_PLACA);
            
            const total = cantidadPlacas * precioPorPlaca;
            
            document.getElementById('texto-m2').innerText = `Total: ${totalMetrosCuadrados.toFixed(2)} m² (${cantidadPlacas} placas necesarias)`;
            document.getElementById('precio-texto').innerText = '$ ' + total.toLocaleString('es-AR');

            if (totalMetrosCuadrados > 0) {
                const ladoFicticio = Math.sqrt(totalMetrosCuadrados);
                placa3D.scale.set(ladoFicticio, 1, ladoFicticio);
                camara.position.z = ladoFicticio * 1.5 + 2;
                camara.position.y = ladoFicticio * 0.5 + 1;
                camara.lookAt(0, 0, 0);
            }
        }

        function enviarWhatsApp() {
            const selectColor = document.getElementById('modelo');
            const colorElegido = selectColor.value;
            
            const precioFinal = document.getElementById('precio-texto').innerText;
            
            // RECORDATORIO: PONER EL NUMERO DE WHATSAPP ACÁ
            const numero = "5491100000000"; 
            
            const mensaje = `Hola JF Reformas! Estuve viendo el cotizador y me gustaría encargar una instalación.%0A%0A📐 Superficie total: ${totalMetrosCuadrados.toFixed(2)} m²%0A🧱 Placas necesarias: ${cantidadPlacas}%0A🏠 Tipo de ambiente: ${tipoAmbienteSeleccionado}%0A🎨 Color: ${colorElegido}%0A💰 Presupuesto estimado: ${precioFinal}%0A%0A¿Tienen disponibilidad?`;
            
            window.open(`https://wa.me/${numero}?text=${mensaje}`, '_blank');
        }

        window.onload = iniciar3D;
    </script>
</body>
</html>
