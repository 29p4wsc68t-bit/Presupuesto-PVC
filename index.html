<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JF Reformas - Cotizador de PVC</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #e0e0e0;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .tarjeta {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
            width: 100%;
            max-width: 400px;
            border-top: 6px solid #000000;
        }
        .logo-container {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }
        .logo-container img {
            width: 130px;
            height: 130px;
            object-fit: cover;
            border-radius: 50%;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            background-color: #000;
        }
        label {
            font-weight: bold;
            color: #000000;
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
        }
        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #000000;
        }
        #canvas-container {
            width: 100%;
            height: 220px;
            background-color: #f0f0f0;
            border-radius: 10px;
            margin-top: 20px;
            overflow: hidden;
            border: 1px solid #ddd;
        }
        .precio-final {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            color: #000000;
            margin: 20px 0;
        }
        .boton-whatsapp {
            background-color: #25D366;
            color: white;
            border: none;
            width: 100%;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(37, 211, 102, 0.3);
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div class="tarjeta">
        <div class="logo-container">
            <!-- Acá está el nombre de la imagen actualizado -->
            <img src="image_3.png.jpg" alt="Logo JF Reformas">
        </div>

        <label>Ancho de la pared (metros)</label>
        <input type="number" id="ancho" value="3" min="0.1" step="0.1" oninput="actualizarCotizacion()">

        <label>Largo de la pared (metros)</label>
        <input type="number" id="largo" value="3" min="0.1" step="0.1" oninput="actualizarCotizacion()">

        <label>Modelo de Placa</label>
        <select id="modelo" onchange="actualizarCotizacion()">
            <option value="15000">Blanco Clásico ($15.000/m²)</option>
            <option value="24600">Gris ($24.600/m²)</option>
            <option value="27000">Símil Madera ($27.000/m²)</option>
        </select>

        <div id="canvas-container"></div>

        <div class="precio-final" id="precio-texto">$ 135.000</div>

        <button class="boton-whatsapp" onclick="enviarWhatsApp()">Pedir por WhatsApp</button>
    </div>

    <script>
        let escena, camara, renderizador, placa;

        function iniciar3D() {
            const contenedor = document.getElementById('canvas-container');
            escena = new THREE.Scene();
            camara = new THREE.PerspectiveCamera(50, contenedor.clientWidth / contenedor.clientHeight, 0.1, 1000);
            renderizador = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderizador.setSize(contenedor.clientWidth, contenedor.clientHeight);
            contenedor.appendChild(renderizador.domElement);

            const luzAmbiental = new THREE.AmbientLight(0xffffff, 0.7);
            escena.add(luzAmbiental);
            const luzDireccional = new THREE.DirectionalLight(0xffffff, 0.8);
            luzDireccional.position.set(5, 10, 7);
            escena.add(luzDireccional);

            const geometria = new THREE.BoxGeometry(1, 0.1, 1);
            const material = new THREE.MeshStandardMaterial({ 
                color: 0xf5f5f5,
                roughness: 0.3,
                metalness: 0.1
            });
            placa = new THREE.Mesh(geometria, material);
            escena.add(placa);

            function animar() {
                requestAnimationFrame(animar);
                placa.rotation.y += 0.005;
                renderizador.render(escena, camara);
            }
            animar();
            actualizarCotizacion();
        }

        function actualizarCotizacion() {
            const ancho = parseFloat(document.getElementById('ancho').value) || 0;
            const largo = parseFloat(document.getElementById('largo').value) || 0;
            const precioMetro = parseFloat(document.getElementById('modelo').value);

            const metrosCuadrados = ancho * largo;
            const total = metrosCuadrados * precioMetro;
            
            document.getElementById('precio-texto').innerText = '$ ' + total.toLocaleString('es-AR');

            if (ancho > 0 && largo > 0) {
                placa.scale.set(ancho, 1, largo);
                const medidaMayor = Math.max(ancho, largo);
                camara.position.z = medidaMayor * 1.5 + 2;
                camara.position.y = medidaMayor * 0.5 + 1;
                camara.lookAt(0, 0, 0);
            }
        }

        function enviarWhatsApp() {
            const ancho = document.getElementById('ancho').value;
            const largo = document.getElementById('largo').value;
            const select = document.getElementById('modelo');
            const modeloNombre = select.options[select.selectedIndex].text;
            const precioFinal = document.getElementById('precio-texto').innerText;
            
            // ACORDATE DE CAMBIAR ESTE NÚMERO
            const numero = "5491131895060"; 
            
            const mensaje = `Hola JF Reformas! Estuve viendo el cotizador y me gustaría encargar una instalación.%0A%0A📏 Medidas: ${ancho}m x ${largo}m%0A🎨 Modelo: ${modeloNombre}%0A💰 Presupuesto estimado: ${precioFinal}%0A%0A¿Tienen disponibilidad?`;
            
            window.open(`https://wa.me/${numero}?text=${mensaje}`, '_blank');
        }

        window.onload = iniciar3D;
    </script>
</body>
</html>
